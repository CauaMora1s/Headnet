openapi: 3.1.0

info:
  title: Headnet control-plane API
  version: "1.0.0"
  summary: Self-hosted mesh VPN control plane
  description: |
    The HTTP API of the Headnet control plane.

    **This document describes only what is implemented.** Endpoints for
    features that have not been built are deliberately absent rather than
    present-and-stubbed: a specification that lists endpoints returning
    fabricated data is worse than one that is honestly short.

    Planned endpoints are listed in
    [docs/ROADMAP.md](https://github.com/CauaMora1s/Headnet/blob/main/docs/ROADMAP.md)
    and will be added here as they land.

    ## Versioning

    The API is versioned in its path (`/api/v1`). The version changes only for
    a breaking change; additive changes — new fields, new endpoints — happen
    in place.

    **Clients must ignore fields they do not recognise.** That requirement is
    what makes additive evolution possible.

    Separately from the API version, a *protocol* version governs the
    client/server contract as a whole. See `/api/v1/protocol/negotiate`.

    ## Errors

    Every non-2xx response carries the same envelope, so a client parses one
    shape:

    ```json
    {
      "error": {
        "code": "bad_request",
        "message": "protocol_version must be a positive integer",
        "details": { "field": "protocol_version" },
        "request_id": "req_4KQZ9V3B2N7XR8T0YCFHJM"
      }
    }
    ```

    `code` is stable and safe to branch on. `message` is for humans and may
    change at any time — do not parse it. `request_id` correlates the response
    with the server log, and is worth quoting in a bug report.

    ## Rate limiting

    Requests are limited per client, **before** routing and authentication.
    Exceeding the budget returns `429` with a `Retry-After` header.

    Behind a reverse proxy every request appears to come from the proxy, so
    the limiter treats it as one client. Forwarding headers are deliberately
    not trusted. See
    [docs/deployment.md](https://github.com/CauaMora1s/Headnet/blob/main/docs/deployment.md).

  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

  contact:
    name: Headnet
    url: https://github.com/CauaMora1s/Headnet

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://vpn.example.com
    description: A self-hosted deployment

tags:
  - name: Operations
    description: |
      Unauthenticated probes for load balancers and orchestrators. They
      disclose nothing beyond a release string and dependency status.
  - name: Protocol
    description: Build identity and version negotiation.
  - name: Authentication
    description: |
      Sign-in, sessions and first-run setup.

      Sessions are server-side, carried in a `Secure` `HttpOnly` `SameSite=Lax`
      cookie. They are deliberately not self-contained tokens: when a device is
      stolen, an administrator has to be able to cut off access immediately,
      and a stateless token cannot be revoked before it expires.

      Every state-changing request must echo the session's CSRF token in the
      `X-CSRF-Token` header. The token is issued at sign-in, returned in the
      response body, and also set as the readable `headnet_csrf` cookie. It is
      bound to the session server-side, so a token from another session — or
      one an attacker chose for themselves — will not do.

      These endpoints carry a tighter rate limit than the rest of the API. They
      are unauthenticated by necessity, and repeated guessing is the whole
      attack against them.
  - name: Devices
    description: |
      The machines on this network.

      A device record holds a WireGuard **public** key and an address. There is
      no field anywhere in this API for a private key: a device generates its
      own key pair and sends only the public half. That is what makes a
      compromised control plane survivable — nothing stored here can decrypt
      any traffic.

      A member sees and manages only their own devices; an administrator sees
      all of them. A device belonging to someone else is reported as `404`
      rather than `403`, because "you may not see this" would confirm it
      exists.

      **These are inventory records.** Nothing carries traffic yet; peer
      connectivity arrives in Phase 3.
  - name: Setup keys
    description: |
      Credentials that enrol a device without an interactive login — for a
      headless server, a container, or a machine being provisioned by a script.

      A setup key is returned **exactly once**, at creation. Only its SHA-256
      is stored, so it cannot be recovered afterwards and reading the database
      yields nothing that can enrol anything. Listings show a short display
      hint, which identifies a key without being able to spend it.

      Keys expire by default, are revocable immediately, and may be limited to
      a single use. Issuing one is an administrative action, because it mints a
      credential that puts a machine on the network.

paths:
  /health:
    get:
      tags: [Operations]
      summary: Aggregate health
      description: |
        Reports the overall status with per-dependency detail.

        Returns `200` when the server is `ok` or `degraded`, and `503` when it
        is `down`. A `503` here is a live server reporting a broken
        dependency, which is different from an unreachable one — clients
        should treat the body as a real answer rather than an error.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The server is usable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              examples:
                healthy:
                  value:
                    status: ok
                    version: 0.1.0
                    uptime_seconds: 3600
                    checks:
                      - name: database
                        status: ok
                        duration_ms: 1
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              examples:
                databaseDown:
                  value:
                    status: down
                    version: 0.1.0
                    uptime_seconds: 42
                    checks:
                      - name: database
                        status: down
                        detail: the database is not reachable
                        duration_ms: 3000
        "429": { $ref: "#/components/responses/RateLimited" }

  /live:
    get:
      tags: [Operations]
      summary: Liveness
      description: |
        Reports that the process is running and able to serve. It checks
        nothing else.

        Use this for a container liveness probe. **Do not use `/ready`** for
        that: `/ready` fails when the database is briefly unreachable, and
        restarting the control plane over that turns a recoverable outage into
        a crash loop.
      operationId: getLive
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /ready:
    get:
      tags: [Operations]
      summary: Readiness
      description: |
        Reports whether the server can serve real traffic: the database is
        reachable and migrated to the schema this build expects.

        Use this for load-balancer rotation.
      operationId: getReady
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Not ready. Take this instance out of rotation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics (not implemented)
      description: |
        Disabled by default. When `observability.metrics_enabled` is false the
        endpoint returns `404`.

        When it is enabled, it returns **`501`** — Prometheus instrumentation
        is a Phase 12 item. It deliberately does not return an empty but valid
        metrics page, because a dashboard would render that as a healthy,
        entirely fictional zero.
      operationId: getMetrics
      security: []
      responses:
        "404":
          description: Metrics are disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "501":
          description: Metrics are enabled but not implemented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                notImplemented:
                  value:
                    error:
                      code: not_implemented
                      message: Prometheus metrics is not implemented yet
                      details:
                        roadmap_phase: Phase 12

  /api/v1/version:
    get:
      tags: [Protocol]
      summary: Build identity and supported protocol range
      description: |
        The first call a client makes. It reports the server release and the
        range of protocol versions the server speaks, so a client can tell
        immediately whether it can talk to this server at all.
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build and protocol information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }
              examples:
                current:
                  value:
                    version: 0.1.0
                    commit: a1b2c3d
                    build_date: "2026-08-29T12:00:00Z"
                    protocol_version: 1
                    min_protocol_version: 1
                    capabilities: [protocol.negotiation]
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/protocol/negotiate:
    post:
      tags: [Protocol]
      summary: Agree a protocol version and capability set
      description: |
        A client sends the protocol range and capabilities it supports; the
        server replies with what both sides will use.

        The agreed version is the highest both accept. The agreed capabilities
        are the intersection of what each advertises — a client must not use
        anything absent from the response.

        Capabilities the server does not recognise are ignored rather than
        rejected, so a newer client talking to an older server degrades
        gracefully.

        When the two ranges do not overlap, the response is `426` naming which
        side needs upgrading. Doing this up front turns a version mismatch
        into one clear error instead of a confusing failure several requests
        later.
      operationId: negotiateProtocol
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NegotiateRequest" }
            examples:
              matching:
                summary: A client speaking the current version
                value:
                  protocol_version: 1
                  capabilities: [protocol.negotiation]
                  client_version: 0.1.0
      responses:
        "200":
          description: Agreed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegotiateResponse" }
              examples:
                agreed:
                  value:
                    protocol_version: 1
                    capabilities: [protocol.negotiation]
                    server_version: 0.1.0
        "400":
          description: The request was malformed or the values were invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "426":
          description: |
            The client and server protocol ranges do not overlap. The message
            says which side must be upgraded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                incompatible:
                  value:
                    error:
                      code: unsupported_protocol_version
                      message: >-
                        incompatible protocol version: the peer is too old
                        (local supports 2..3, peer supports 1..1);
                        upgrade the peer
                      details:
                        server_protocol_version: "3"
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/status:
    get:
      tags: [Authentication]
      summary: Whether the installation needs setting up
      description: |
        Tells a client which flow to present before it has any credentials: a
        sign-in form, or the first-run form.

        Unauthenticated, and deliberately uninformative beyond that. It
        discloses no account addresses, no configuration and no instance
        identity.
      operationId: getAuthStatus
      security: []
      responses:
        "200":
          description: The current authentication state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
              examples:
                fresh:
                  summary: A server nobody has claimed yet
                  value:
                    bootstrap_required: true
                    providers: [local]
                claimed:
                  value:
                    bootstrap_required: false
                    providers: [local]
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/bootstrap:
    post:
      tags: [Authentication]
      summary: Create the first administrator
      description: |
        Creates the first account on a fresh installation and signs it in. The
        account is necessarily an administrator: there is nobody else to grant
        it the role later.

        **This endpoint is open until it is claimed.** That is a deliberate
        trade-off in favour of the "deploy, open the web UI, create an account"
        flow, and it has a real cost: a publicly reachable server that nobody
        has claimed can be claimed by whoever finds it first. Claim yours
        immediately, and do not expose the server publicly until you have. The
        server logs a warning on every start until it is claimed.

        The claim is exactly-once and atomic, so concurrent requests cannot
        both succeed. A rejected account — a password that is too short, say —
        does not consume the claim.
      operationId: bootstrap
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRequest" }
      responses:
        "201":
          description: The administrator was created and signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Sets `headnet_session` and `headnet_csrf`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: The email address or password was rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The installation already has an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: |
        Authenticates an account and issues a session.

        A wrong password and an unregistered address produce an identical
        response, in content and in timing. Any difference would turn this
        endpoint into a way to discover which addresses have accounts.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Sets `headnet_session` and `headnet_csrf`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: The request body was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: The email address or password is incorrect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                rejected:
                  value:
                    error:
                      code: unauthorized
                      message: the email address or password is incorrect
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out
      description: |
        Revokes the session server-side and clears both cookies. It stops
        working immediately, not at its expiry.
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The CSRF token was missing or wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/session:
    get:
      tags: [Authentication]
      summary: The current session
      description: |
        Returns the signed-in account and when the session expires.

        `csrf_token` is empty here: only a hash of it is stored, so it cannot
        be handed back after issue. A browser client reads it from the
        `headnet_csrf` cookie instead.
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Not signed in, or the session has ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List devices
      description: |
        Returns the caller's devices, or every device when the caller is an
        administrator. Newest first.
      operationId: listDevices
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The devices in scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    post:
      tags: [Devices]
      summary: Register a device
      description: |
        Adds a device owned by the signed-in user and allocates its addresses.

        The device row and its address allocation are written in one
        transaction, so a rejected registration leaks no address.
      operationId: registerDevice
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
      responses:
        "201":
          description: The device was registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400":
          description: The name or public key was rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The CSRF token was missing or wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: That public key is already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: |
            The address pool is exhausted. An operator has to widen it, which
            is a re-addressing exercise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Devices]
      summary: Fetch a device
      operationId: getDevice
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            No such device — including one that exists but belongs to another
            user, because reporting `403` would confirm it exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [Devices]
      summary: Revoke a device
      description: |
        Removes a device from the network and releases its addresses back to
        the pool, in one transaction.

        The record is kept and marked revoked, so the audit trail survives —
        and its public key therefore stays blocked permanently. That is
        intended: a revoked key that could be registered again would not really
        be revoked.
      operationId: revokeDevice
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The device was revoked.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The CSRF token was missing or wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The device has already been revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/devices/enroll:
    post:
      tags: [Devices]
      summary: Enrol a device with a setup key
      description: |
        Redeems a setup key and registers the device it authorises. The device
        is owned by the account that created the key.

        **Unauthenticated**: the setup key is itself the credential, which is
        the whole point of a headless enrolment. It therefore carries the same
        tighter rate limit as sign-in.

        Every rejected key — revoked, expired, used up, or never existing —
        produces an identical `401`. Distinguishing them would tell whoever is
        holding a rejected key whether it ever existed.

        Redemption and device creation are one transaction, so a rejected
        device does not spend a single-use key.
      operationId: enrollDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollDeviceRequest" }
      responses:
        "201":
          description: The device was enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400":
          description: The name or public key was rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: The setup key was not accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                rejected:
                  value:
                    error:
                      code: unauthorized
                      message: that setup key is not valid
        "409":
          description: That public key is already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/setup-keys:
    get:
      tags: [Setup keys]
      summary: List setup keys
      description: |
        Returns every setup key. The keys themselves are absent — only their
        display hints, which cannot enrol anything.
      operationId: listSetupKeys
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The setup keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupKeyList" }
        "403":
          description: Administrator only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    post:
      tags: [Setup keys]
      summary: Create a setup key
      description: |
        Issues an enrolment credential and returns it **once**. It cannot be
        recovered afterwards; the server stores only its hash.

        A key expires by default. Creating one that never expires requires
        `never_expires`, so that choosing it is a deliberate act rather than an
        omission.
      operationId: createSetupKey
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSetupKeyRequest" }
      responses:
        "201":
          description: The key was created. This is the only time it is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateSetupKeyResponse" }
        "400":
          description: The request was malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Administrator only, or the CSRF token was missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/setup-keys/{id}:
    delete:
      tags: [Setup keys]
      summary: Revoke a setup key
      description: |
        Ends a key immediately. Revoking one twice is not an error, and the
        recorded time stays the first revocation — when it actually stopped
        working.
      operationId: revokeSetupKey
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: The key was revoked.
        "403":
          description: Administrator only, or the CSRF token was missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such setup key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: headnet_session
      description: |
        Server-side sessions in a `Secure`, `HttpOnly`, `SameSite=Lax` cookie.
        `Secure` is set whenever the deployment's base URL is HTTPS.

        Sessions are deliberately not stateless tokens: when a device is
        stolen, an administrator must be able to revoke access immediately,
        and a self-contained token cannot be revoked before it expires.

        State-changing requests must additionally carry the `X-CSRF-Token`
        header. See the Authentication tag.

  responses:
    RateLimited:
      description: |
        The client exceeded its request budget. `Retry-After` gives the number
        of seconds to wait.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            limited:
              value:
                error:
                  code: rate_limited
                  message: too many requests; slow down and try again shortly
                  details:
                    retry_after_seconds: "12"

    PayloadTooLarge:
      description: The request body exceeded `server.max_body_bytes`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: string
      enum: [ok, degraded, down]
      description: |
        `ok` — fully functional.
        `degraded` — working, but something needs an operator's attention.
        `down` — not usable.

    Check:
      type: object
      required: [name, status, duration_ms]
      properties:
        name:
          type: string
          description: The dependency probed.
          examples: [database]
        status: { $ref: "#/components/schemas/HealthStatus" }
        detail:
          type: string
          description: |
            An operator-facing explanation of a non-`ok` status.

            Health endpoints are unauthenticated, so this never contains a
            connection string, a credential, a file path or a driver error.
          examples: [the database is not reachable]
        duration_ms:
          type: integer
          format: int64
          description: How long the probe took.

    HealthResponse:
      type: object
      required: [status, version, uptime_seconds, checks]
      properties:
        status:
          allOf: [{ $ref: "#/components/schemas/HealthStatus" }]
          description: The worst status among the checks.
        version:
          type: string
          examples: ["0.1.0"]
        uptime_seconds:
          type: integer
          format: int64
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }

    VersionResponse:
      type: object
      required:
        [version, commit, build_date, protocol_version, min_protocol_version, capabilities]
      properties:
        version:
          type: string
          description: The server release.
        commit:
          type: string
          description: |
            The git revision, suffixed `-dirty` when built from a modified
            tree. `unknown` for a build with no VCS information.
        build_date:
          type: string
          description: RFC 3339 build timestamp, or `unknown`.
        protocol_version:
          type: integer
          minimum: 1
          description: The newest protocol version the server speaks.
        min_protocol_version:
          type: integer
          minimum: 1
          description: The oldest protocol version the server accepts.
        capabilities:
          type: array
          items: { type: string }
          description: |
            Optional behaviours this server implements. A capability appears
            here only once the behaviour behind it actually works end to end.

    NegotiateRequest:
      type: object
      required: [protocol_version]
      properties:
        protocol_version:
          type: integer
          minimum: 1
          description: The newest version the client speaks.
        min_protocol_version:
          type: integer
          minimum: 1
          description: |
            The oldest version the client accepts. Omitted or zero means the
            client speaks exactly `protocol_version`.
        capabilities:
          type: array
          items: { type: string }
          description: |
            Optional behaviours the client implements. Names the server does
            not recognise are ignored rather than rejected.
        client_version:
          type: string
          description: |
            The client release string. Recorded for diagnostics and fleet
            visibility only; it never affects the outcome.

    NegotiateResponse:
      type: object
      required: [protocol_version, capabilities, server_version]
      properties:
        protocol_version:
          type: integer
          description: The version both sides will use.
        capabilities:
          type: array
          items: { type: string }
          description: |
            The behaviours both sides implement. A client must not use
            anything absent from this list.
        server_version:
          type: string

    ErrorCode:
      type: string
      description: |
        A stable, machine-readable classification. Codes may be added but are
        never renamed or repurposed, so branching on them is safe.
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - payload_too_large
        - rate_limited
        - unsupported_protocol_version
        - not_implemented
        - unavailable
        - internal

    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: |
            A human-readable explanation, safe to show an operator. It never
            contains secrets, key material or internal stack detail — and it
            may change at any time, so do not parse it.
        details:
          type: object
          additionalProperties: { type: string }
          description: |
            Structured, code-specific context: the field that failed
            validation, the roadmap phase behind a `not_implemented`, and so
            on.
        request_id:
          type: string
          description: |
            Correlates this response with the server log. Also returned in the
            `X-Request-Id` header. Quote it in a bug report.
          examples: [req_4KQZ9V3B2N7XR8T0YCFHJM]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    AuthStatus:
      type: object
      required: [bootstrap_required, providers]
      properties:
        bootstrap_required:
          type: boolean
          description: No account exists yet; the installation is unclaimed.
        providers:
          type: array
          items: { type: string, enum: [local, oidc] }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    BootstrapRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          format: password
          description: |
            At least `auth.min_password_length` characters, and never fewer
            than 12 whatever the configuration says. Length is asked for rather
            than composition rules, which mostly produce `Password1!`.
        display_name: { type: string }

    User:
      type: object
      required: [id, email, role, provider, created_at]
      description: |
        An account. There is deliberately no password field of any kind — not
        the hash, not a placeholder. A schema with somewhere to put one is a
        schema that will eventually carry one.
      properties:
        id:
          type: string
          examples: ["usr_4KQZ9V3B2N7XR8T0YCFHJM"]
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, member] }
        provider: { type: string, enum: [local, oidc] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    Device:
      type: object
      required: [id, user_id, name, public_key, created_at]
      description: |
        A machine on the network.

        There is deliberately no private key field of any kind — not the value,
        not a placeholder. A schema with somewhere to put one is a schema that
        will eventually carry it.
      properties:
        id:
          type: string
          examples: ["dev_4KQZ9V3B2N7XR8T0YCFHJM"]
        user_id: { type: string }
        name: { type: string }
        public_key:
          type: string
          description: A base64-encoded 32-byte WireGuard **public** key.
        os: { type: string }
        hostname: { type: string }
        ipv4:
          type: string
          description: Cleared on revocation, when the address returns to the pool.
        ipv6: { type: string }
        enrolled_with:
          type: string
          description: |
            The setup key this device was enrolled with, if any. It survives
            that key's deletion, so the audit trail is not lost with it.
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/Device" }

    RegisterDeviceRequest:
      type: object
      required: [name, public_key]
      properties:
        name: { type: string, maxLength: 64 }
        public_key:
          type: string
          description: |
            A base64-encoded 32-byte WireGuard public key. An all-zero key is
            refused: it is what an uninitialised buffer looks like, and
            accepting it would mean enrolling a device whose key generation
            silently failed.
        os: { type: string, maxLength: 128 }
        hostname: { type: string, maxLength: 128 }

    EnrollDeviceRequest:
      type: object
      required: [setup_key, name, public_key]
      properties:
        setup_key:
          type: string
          description: The credential issued by POST /api/v1/setup-keys.
        name: { type: string, maxLength: 64 }
        public_key: { type: string }
        os: { type: string, maxLength: 128 }
        hostname: { type: string, maxLength: 128 }

    SetupKey:
      type: object
      required: [id, display_hint, created_by, created_at, max_uses, uses, usable]
      description: |
        An enrolment credential. The key itself is absent: it is returned once,
        by CreateSetupKeyResponse, and only its hash is stored.
      properties:
        id:
          type: string
          examples: ["sk_4KQZ9V3B2N7XR8T0YCFHJM"]
        display_hint:
          type: string
          description: |
            The leading characters of the key, so it can be recognised in a
            list. Far too little to use — an attacker holding it still faces
            the remaining entropy.
        description: { type: string, maxLength: 200 }
        tags:
          type: array
          items: { type: string }
          description: |
            The key's scope. Phase 6's policy engine will read these. Nothing
            enforces them today.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Absent only on a key created with `never_expires`.
        max_uses:
          type: integer
          description: Zero means unlimited; one makes the key single-use.
        uses: { type: integer }
        revoked_at: { type: string, format: date-time }
        usable:
          type: boolean
          description: |
            Whether the key would be accepted right now, so a client need not
            re-derive expiry and use-count logic.

    SetupKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/SetupKey" }

    CreateSetupKeyRequest:
      type: object
      properties:
        description: { type: string, maxLength: 200 }
        tags:
          type: array
          items: { type: string }
        expires_in_hours:
          type: integer
          minimum: 0
          description: Omitted or zero means the server default of 7 days.
        never_expires:
          type: boolean
          description: |
            Creates a key with no expiry. Required explicitly, because a
            credential that never expires is one you will still be finding in
            shell histories years from now.
        max_uses:
          type: integer
          minimum: 0
          description: Zero means unlimited; one makes the key single-use.

    CreateSetupKeyResponse:
      type: object
      required: [key, setup_key]
      properties:
        key: { $ref: "#/components/schemas/SetupKey" }
        setup_key:
          type: string
          description: |
            The credential, returned **exactly once**. It cannot be recovered
            afterwards. Show it to the operator, then forget it.

    Session:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token:
          type: string
          description: |
            Echo this in `X-CSRF-Token` on every state-changing request. It is
            also set as the readable `headnet_csrf` cookie.

            Empty on `GET /api/v1/auth/session`: only a hash is stored, so it
            cannot be handed back after issue.
        expires_at:
          type: string
          format: date-time
